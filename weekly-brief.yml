name: Aktualisiere Wochenbriefing

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recherche und Briefing erstellen
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.4
        run: node scripts/update-weekly-brief.mjs
      - name: Veröffentlichung speichern
        run: |
          git config user.name "Lernimpuls Bot"
          git config user.email "actions@github.com"
          git add index.html data/seen.json data/weekly-brief.json
          git diff --cached --quiet || git commit -m "Aktualisiere Wochenbriefing"
          git push
